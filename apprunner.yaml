version: 1.0

runtime: python311  # Specified version directly

build:
  commands:
    build:
      - pip install --upgrade pip
      - pip install -r requirements.txt

run:
  runtime-version: 3.11
  # If you want to run BOTH services (MCP + Secondary), use the script:
  command: sh ./start_services.sh
  
  # If you decide to run ONLY the MCP Flask server:
  # command: gunicorn --bind 0.0.0.0:8080 knowledge_server:app
  
  network:
    port: 8080
  
  env:
    - name: PORT
      value: "8080"
    - name: FLASK_ENV
      value: "production"

